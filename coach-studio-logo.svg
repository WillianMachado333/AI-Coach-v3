<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Coach Studio logo</title>
  <desc id="desc">A flowing letter C converging toward two directional stars.</desc>
