  <path d="M91 27C82 20 71 16 59 16 32.5 16 11 37.5 11 64s21.5 48 48 48c12 0 23-4.4 31.5-11.7L76.8 84.7A27.2 27.2 0 0 1 59 91.3 27.3 27.3 0 1 1 76.6 43.8L91 27Z" fill="url(#flow)"/>
