    <linearGradient id="flow" x1="18" y1="104" x2="102" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#087F79"/>
      <stop offset="0.55" stop-color="#10A7B0"/>
      <stop offset="1" stop-color="#32C5E5"/>
